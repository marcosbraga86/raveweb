<script>

/* ===== Login e sincronização (Supabase) ===== */
const SB_URL='https://xedvpyoxfcntqgpuybnr.supabase.co',SB_KEY='sb_publishable_ZMk6ZVQKXjXBTbW_fBtFmg_Ei_djh9G';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const KEYS=[K1,K2];
let USER=null,CACHE={},PEND={},TIMERS={},BOOTED=false,RECOVERY=false;
const lk=k=>`rave:${USER?.id}:${k}`;
const clone=v=>JSON.parse(JSON.stringify(v));
const pp=()=>{try{localStorage.setItem(`rave-pend:${USER.id}`,JSON.stringify(Object.keys(PEND)))}catch(e){}};
const ST_TXT={ok:'Salvo',sync:'Enviando…',err:'Sem conexão',off:'Offline'};
function setST(s){const e=$('#st');if(!e)return;e.textContent=ST_TXT[s]||'';e.title=s==='err'||s==='off'?'Alterações ficam guardadas neste aparelho e são enviadas quando houver conexão.':''}
const ld=(k,d)=>{const v=CACHE[k];return v==null?d:clone(v)};
const sv=(k,v)=>{if(!USER){alert('Entre na sua conta para salvar.');return false}CACHE[k]=clone(v);try{localStorage.setItem(lk(k),JSON.stringify(v))}catch(e){}agendar(k);return true};
function agendar(k){PEND[k]=true;pp();setST('sync');clearTimeout(TIMERS[k]);TIMERS[k]=setTimeout(()=>enviar(k),700)}
async function enviar(k){
 if(!USER)return;const uid=USER.id;
 try{
  const r=CACHE[k]===undefined
   ?await sb.from('dados_app').delete().eq('user_id',uid).eq('chave',k)
   :await sb.from('dados_app').upsert({user_id:uid,chave:k,valor:CACHE[k],atualizado_em:new Date().toISOString()},{onConflict:'user_id,chave'});
  if(r.error)throw r.error;
  delete PEND[k];pp();
  if(!Object.keys(PEND).length)setST('ok')
 }catch(e){console.error('sync',e);setST('err');clearTimeout(TIMERS[k]);TIMERS[k]=setTimeout(()=>enviar(k),15000)}
}
async function flush(){for(const k of Object.keys(PEND)){clearTimeout(TIMERS[k]);await enviar(k)}}
async function carregarDados(){
 const{data,error}=await sb.from('dados_app').select('chave,valor').in('chave',KEYS);
 if(error)throw error;
 const rem={};(data||[]).forEach(x=>rem[x.chave]=x.valor);
 let pend=[];try{pend=JSON.parse(localStorage.getItem(`rave-pend:${USER.id}`)||'[]')}catch(e){}
 const migKey=`rave-mig:${USER.id}`,leg={};
 if(!localStorage.getItem(migKey)){
  for(const k of KEYS){const l=localStorage.getItem(k);if(l!==null&&rem[k]===undefined&&!pend.includes(k))leg[k]=l}
  if(Object.keys(leg).length&&!confirm('Encontrei perfil/relatórios salvos neste aparelho antes do login. Deseja importar para a sua conta?'))for(const k in leg)delete leg[k];
  try{localStorage.setItem(migKey,'1')}catch(e){}
 }
 let mudou=false;
 for(const k of KEYS){
  const loc=localStorage.getItem(lk(k)),ant=JSON.stringify(CACHE[k]);let novo,env=false;
  if(pend.includes(k)&&loc!==null){novo=JSON.parse(loc);env=true}
  else if(rem[k]!==undefined)novo=rem[k];
  else if(leg[k]!==undefined){novo=JSON.parse(leg[k]);env=true}
  if(novo===undefined)delete CACHE[k];else CACHE[k]=novo;
  try{novo===undefined?localStorage.removeItem(lk(k)):localStorage.setItem(lk(k),JSON.stringify(novo))}catch(e){}
  if(JSON.stringify(novo)!==ant)mudou=true;
  if(env)agendar(k)
 }
 return mudou
}
function carregarLocal(){for(const k of KEYS){const l=localStorage.getItem(lk(k));if(l!==null)try{CACHE[k]=JSON.parse(l)}catch(e){}}}
async function carregarSeguro(){
 try{await carregarDados();setST('ok')}
 catch(e){console.error(e);carregarLocal();setST('off');
  if(/dados_app|PGRST205|42P01/.test(JSON.stringify(e)))alert('A tabela "dados_app" não foi encontrada no Supabase. Rode o script SQL no SQL Editor e recarregue a página.')}
}
async function sessao(s,ev){
 const novo=s&&s.user||null;
 if(ev==='PASSWORD_RECOVERY')RECOVERY=true;
 if(novo&&USER&&novo.id===USER.id){USER=novo;if(ev==='PASSWORD_RECOVERY')render();return}
 if(!novo&&!USER&&BOOTED){if(ev==='PASSWORD_RECOVERY')render();return}
 if(novo){USER=novo;CACHE={};PEND={};await carregarSeguro()}
 else{USER=null;CACHE={};PEND={};RECOVERY=false}
 BOOTED=true;if((location.hash.slice(1)||'/')!=='/')location.hash='#/';render()
}
async function sair(){
 await flush();
 if(Object.keys(PEND).length&&!confirm('Há alterações que ainda não foram enviadas (sem conexão). Se sair agora, elas só serão enviadas no próximo login neste aparelho. Sair mesmo assim?'))return;
 if(!Object.keys(PEND).length)KEYS.forEach(k=>{try{localStorage.removeItem(lk(k));localStorage.removeItem(`rave-pend:${USER.id}`)}catch(e){}});
 await sb.auth.signOut()
}
const aviso=(t,x)=>`<div class="${t}">${esc(x)}</div>`;
const msgErr=m=>{const t={'Invalid login credentials':'E-mail ou senha incorretos.','Email not confirmed':'Confirme seu e-mail pelo link que enviamos antes de entrar.','User already registered':'Este e-mail já tem conta. Use "Entrar" ou recupere a senha.'}[m];
 if(t)return t;if(/at least/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';if(/fetch|network/i.test(m))return 'Sem conexão. Verifique a internet e tente de novo.';return m};
function telaLogin(modo,msg){
 modo=modo||(RECOVERY?'nova':'entrar');$('#ft').innerHTML='';
 const T={entrar:['Entrar','Acesse seus relatórios em qualquer aparelho.','Entrar'],criar:['Criar conta','Use seu e-mail e uma senha com pelo menos 6 caracteres.','Criar conta'],esqueci:['Recuperar senha','Enviaremos um link para o seu e-mail.','Enviar link'],nova:['Nova senha','Defina a nova senha da sua conta.','Salvar nova senha']}[modo];
 M.innerHTML=`<div class="hero"><span class="badge">${ic('user',14)} RAVE Web</span><h1>${T[0]}</h1><p>${T[1]}</p></div>
<form class="card" id="lf" style="max-width:28rem;margin:0 auto 1rem" novalidate><div id="am">${msg||''}</div>
${modo!=='nova'?`<label for="em">E-mail</label><input class="in" id="em" type="email" autocomplete="email" inputmode="email" autocapitalize="off">`:''}
${modo!=='esqueci'?`<label for="pw">${modo==='nova'?'Nova senha':'Senha'}</label><input class="in" id="pw" type="password" autocomplete="${modo==='entrar'?'current-password':'new-password'}">`:''}
<div style="margin-top:1rem"><button class="btn f" id="go" type="submit">${T[2]}</button></div>
${modo==='entrar'?`<div class="row" style="margin-top:.5rem"><button class="btn g" type="button" data-m="criar">Criar conta</button><button class="btn g" type="button" data-m="esqueci">Esqueci a senha</button></div>`:''}
${modo==='criar'||modo==='esqueci'?`<div style="margin-top:.5rem"><button class="btn g f" type="button" data-m="entrar">Voltar para entrar</button></div>`:''}</form>`;
 M.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>telaLogin(b.dataset.m));
 const say=(t,x)=>{$('#am').innerHTML=aviso(t,x)},base=location.href.split('#')[0];
 $('#lf').onsubmit=async e=>{e.preventDefault();
  const em=($('#em')?.value||'').trim(),pw=$('#pw')?.value||'',b=$('#go');
  if(modo!=='nova'&&!em)return say('err','Informe o e-mail.');
  if(modo!=='esqueci'){if(modo==='entrar'&&!pw)return say('err','Informe a senha.');if(modo!=='entrar'&&pw.length<6)return say('err','A senha precisa ter pelo menos 6 caracteres.')}
  b.disabled=true;
  try{
   if(modo==='entrar'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
   else if(modo==='criar'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:base}});if(error)throw error;
    if(data.user&&data.user.identities&&data.user.identities.length===0)throw new Error('User already registered');
    if(!data.session)return telaLogin('entrar',aviso('ok','Conta criada. Enviamos um link de confirmação para o seu e-mail. Confirme e depois entre.'))}
   else if(modo==='esqueci'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:base});if(error)throw error;return telaLogin('entrar',aviso('ok','Se o e-mail tiver conta, você receberá um link para criar uma nova senha.'))}
   else{const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;RECOVERY=false;render()}
  }catch(err){say('err',msgErr(err.message||String(err)));b.disabled=false}
 };
 setTimeout(()=>($('#em')||$('#pw'))?.focus(),0)
}
const loadRelatorios=()=>ld(K1,[]),saveRelatorios=l=>sv(K1,l);
const getRelatorio=id=>loadRelatorios().find(r=>r.id===id);
function upsertRelatorio(r){const l=loadRelatorios(),i=l.findIndex(x=>x.id===r.id);r.atualizadoEm=new Date().toISOString();i<0?l.unshift(r):l[i]=r;return saveRelatorios(l)}
const deleteRelatorio=id=>saveRelatorios(loadRelatorios().filter(r=>r.id!==id));
function upsertDespesa(rid,d){const r=getRelatorio(rid);const i=r.despesas.findIndex(x=>x.id===d.id);i<0?r.despesas.push(d):r.despesas[i]=d;return upsertRelatorio(r)}
function deleteDespesa(rid,did){const r=getRelatorio(rid);r.despesas=r.despesas.filter(x=>x.id!==did);upsertRelatorio(r)}
const carregarPerfil=()=>ld(K2,null),temPerfil=()=>!!carregarPerfil(),perfilCompleto=()=>{const p=carregarPerfil();return !!(p&&p.nome&&p.centroCusto&&p.funcionalSap&&p.quickLookId)},apagarPerfil=()=>{delete CACHE[K2];try{localStorage.removeItem(lk(K2))}catch(e){}agendar(K2)};
function salvarPerfil(p){const o=carregarPerfil(),n=new Date().toISOString();return sv(K2,{...p,criadoEm:o?.criadoEm||n,atualizadoEm:n})}
const fileToDataUrl=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const loadPdfJs=()=>window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});
async function renderPdfComoImagens(url,max=8,esc_=1.4){try{await loadPdfJs();
pdfjsLib.GlobalWorkerOptions.workerSrc=document.querySelector('script[src*="jsdelivr"]')?'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js':'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const b=atob(url.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
const pdf=await pdfjsLib.getDocument({data:u}).promise,out=[];
for(let p=1;p<=Math.min(pdf.numPages,max);p++){const pg=await pdf.getPage(p),vp=pg.getViewport({scale:esc_}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',0.85))}return out}catch(e){console.error(e);return[]}}
function calcularTotais(r){const por=TIPOS.map(t=>({key:t.codigo,nome:t.nome,total:rd(r.despesas.filter(d=>d.tipoCodigo===t.codigo).reduce((s,d)=>s+d.valor,0))}));
const total=rd(r.despesas.reduce((s,d)=>s+d.valor,0)),ad=r.adiantamento||0,cc=r.cartaoCorporativo||0,saldo=rd(ad+cc-total);

${an.length?`<div class="card"><h3>Comprovantes (${an.length})</h3><div class="th">${an.map(a=>thumb(a)?`<img src="${thumb(a)}" title="${esc(a.nome)}" alt="${esc(a.nome)}">`:`<span class="badge">${esc(a.nome)}</span>`).join('')}</div></div>`:''}
${bar(`<button class="btn o" data-go="/relatorio/${id}/despesa/nova">Nova despesa</button><button class="btn a" id="ex">${ic('filedown')} Exportar PDF</button>`)}`;
M.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{if(confirm('Excluir esta despesa?')){deleteDespesa(id,b.dataset.dd);detail(id)}});
$('#ex').onclick=()=>exportar(getRelatorio(id));wire()}

let anx=[];
function despForm(rid,did,banner){const r=getRelatorio(rid);if(!r)return nf();const ex=did&&r.despesas.find(x=>x.id===did);if(did&&!ex)return nf();
const d=ex||{tipoCodigo:TIPOS[0].codigo,data:'',valor:0,distancia:'',origem:'',destino:'',osSr:'',observacao:'',anexos:[]};anx=[...d.anexos];
M.innerHTML=`<div class="row" style="align-items:center;margin-bottom:1rem"><div style="display:flex;gap:.5rem;align-items:center"><button class="btn o i" data-go="/relatorio/${rid}">${ic('left')}</button><h1 style="margin:0;font-size:1.3rem">${ex?'Editar despesa':'Nova despesa'}</h1></div><span class="badge">${r.despesas.length} lançadas</span></div>
${banner?'<div class="ok">'+ic('check',16)+' Despesa salva. Lance a próxima.</div>':''}<div id="ms"></div>
<div class="card"><h3>Tipo e valor</h3><label>Tipo*</label><select class="in" name="tp">${TIPOS.map(t=>`<option value="${t.codigo}" ${t.codigo===d.tipoCodigo?'selected':''}>${t.nome}</option>`).join('')}</select><div class="g2"><div><label>Data*</label><input class="in" type="date" name="dt" min="${r.dataInicio}" max="${r.dataFim}" value="${d.data}"></div><div><label>Valor*</label>${cur('vl',d.valor)}</div></div><label>Distância (km)</label><input class="in" type="number" min="0" step="0.1" name="ds" value="${d.distancia??''}"></div>
<div class="card"><h3>Trajeto e observações</h3><label>Origem</label><input class="in" name="og" value="${esc(d.origem)}"><label>Destino</label><input class="in" name="dn" value="${esc(d.destino)}"><div class="g2"><div><label>OS/SR</label><input class="in" name="os" value="${esc(d.osSr)}"></div><div><label>Observação curta</label><input class="in" name="ob" value="${esc(d.observacao)}"></div></div></div>
<div class="card"><h3>Comprovantes <span class="badge" id="cn"></span></h3><input type="file" id="fc" class="hid" accept="image/*" capture="environment"><input type="file" id="ff" class="hid" accept="image/*,application/pdf" multiple>
<div class="g2" style="gap:.5rem"><button class="btn dash" id="bc" style="margin-bottom:.5rem">${ic('camera',22)} Tirar foto</button><button class="btn dash" id="bf" style="margin-bottom:.5rem">${ic('clip',22)} Anexar PDF/Imagem</button></div><div id="ld" class="mut hid"><span class="sp" style="display:inline-block">${ic('loader',16)}</span> Processando arquivos…</div><div id="al"></div></div>
${bar(`<button class="btn o" id="sa">${ic('plusc')} Salvar e adicionar outra despesa</button><button class="btn" id="s1">Salvar</button>${ex?`<button class="btn d i" id="dl" aria-label="Excluir">${ic('trash')}</button>`:''}`)}`;
const list=()=>{$('#cn').textContent=anx.length;$('#al').innerHTML=anx.map((a,i)=>`<div class="row" style="align-items:center;border-top:1px solid var(--bd);padding:.5rem 0"><div style="display:flex;gap:.6rem;align-items:center;min-width:0">${thumb(a)?`<img src="${thumb(a)}" style="width:48px;height:48px;object-fit:cover;border-radius:8px" alt="">`:`<div class="av">${ic('file',22)}</div>`}<div style="min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(a.nome)}</b></div><div class="mut">${a.tipo}${a.paginasImagem?.length?' · '+a.paginasImagem.length+' pág.':''}</div></div></div><button class="btn g i" data-rm="${i}" aria-label="Remover">${ic('x')}</button></div>`).join('');
$('#al').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{anx.splice(+b.dataset.rm,1);list()})};list();
const proc=async fs=>{$('#ld').classList.remove('hid');for(const f of fs){try{const pdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),u=await fileToDataUrl(f),a={id:newId(),nome:f.name,tipo:pdf?'application/pdf':(f.type||'application/octet-stream'),dataUrl:u,criadoEm:new Date().toISOString()};if(pdf){a.paginasImagem=await renderPdfComoImagens(u,8,1.4);if(!a.paginasImagem.length)$('#ms').innerHTML='<div class="err">Não foi possível gerar as páginas de '+esc(f.name)+'. Verifique a conexão e tente de novo; sem isso o PDF não sai no relatório impresso.</div>'}anx.push(a)}catch(e){$('#ms').innerHTML=`<div class="err">Falha ao ler ${esc(f.name)}.</div>`}}$('#ld').classList.add('hid');list()};
$('#bc').onclick=()=>$('#fc').click();$('#bf').onclick=()=>$('#ff').click();
for(const i of['#fc','#ff'])$(i).onchange=e=>{proc([...e.target.files]);e.target.value=''};
const save=()=>{const e=[],dt=$('[name=dt]').value,v=cv('vl'),t=TIPOS.find(x=>x.codigo===$('[name=tp]').value);
if(!t)e.push('Tipo inválido.');if(!dt)e.push('Informe a data.');else if(dt<r.dataInicio||dt>r.dataFim)e.push(`A data deve estar entre ${fd(r.dataInicio)} e ${fd(r.dataFim)}.`);if(!(v>0))e.push('O valor deve ser maior que zero.');
if(e.length){$('#ms').innerHTML=`<div class="err">${e.join('<br>')}</div>`;scrollTo(0,0);return false}
const km=val('ds');return upsertDespesa(rid,{id:ex?.id||newId(),data:dt,tipoCodigo:t.codigo,tipoNome:t.nome,valor:v,distancia:km?Number(km):undefined,origem:val('og'),destino:val('dn'),osSr:val('os'),observacao:val('ob'),anexos:anx})};
$('#s1').onclick=()=>{if(save())go('/relatorio/'+rid)};
$('#sa').onclick=()=>{if(!save())return;if(location.hash==='#/relatorio/'+rid+'/despesa/nova')despForm(rid,null,true);else location.replace('#/relatorio/'+rid+'/despesa/nova')};
if($('#dl'))$('#dl').onclick=()=>{if(confirm('Excluir esta despesa?')){deleteDespesa(rid,did);go('/relatorio/'+rid)}};wire()}
let flash=false;

function html(r){const t=calcularTotais(r),now=new Date().toLocaleString('pt-BR'),an=allAnx(r),hh=r.houveHospedagem===true,hr=hh&&r.anexoHospedagem||null;
const li=(l,v)=>`<div><span>${l}</span><b>${esc(v)||'—'}</b></div>`;
return`<!DOCTYPE html><html><head><meta charset="utf-8"><title>RAVE ${esc(r.descricao)}</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:11px;color:#111;margin:0}.h{background:#14532d;color:#fff;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:6px}.h h1{margin:2px 0;font-size:22px}.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0}.g div{border-bottom:1px solid #d1d5db;padding:3px 0;display:flex;justify-content:space-between;gap:8px}.g span{color:#555}h2{font-size:13px;color:#14532d;border-bottom:2px solid #14532d;margin:14px 0 6px}table{width:100%;border-collapse:collapse;font-size:9.5px}th{background:#14532d;color:#fff}th,td{border:1px solid #cbd5e1;padding:3px 4px;text-align:left}.cm{background:#ecfdf5;border-left:4px solid #10b981;padding:8px;margin:10px 0}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:50px}.sg div{border-top:1px solid #111;text-align:center;padding-top:4px;font-weight:bold}.ft{margin-top:20px;font-size:9px;color:#555;text-align:center}.pg{page-break-before:always;text-align:center}.pg img{max-width:100%;max-height:240mm}</style></head><body>
<div class="h"><div style="display:flex;gap:10px;align-items:center">${logo(44)}<div><div>NCR ATLEOS · RAVE Web</div><h1>RAVE</h1><div>Relatório Administrativo de Viagens e Entretenimento / Travel &amp; Entertainment Expense Report</div></div></div><div style="text-align:right">Gerado em<br><b>${now}</b><br>ID<br><b>${r.id}</b></div></div>
<div class="g">${li('Nome',r.nome)}${li('Descrição',r.descricao)}${li('Datas',fd(r.dataInicio)+' a '+fd(r.dataFim))}${li('Organização',r.organizacao)}${li('Funcional SAP',r.funcionalSap)}${li('Centro de Custo',r.centroCusto)}${li('QuickLook ID',r.quickLookId)}${li('Houve hospedagem',hh?'Sim':'Não')}${hr?li('Reserva de hospedagem',hr.nome):''}${li('Nº Viagem SAP',r.numeroViagemSap)}${li('Adiantamento',fmt(r.adiantamento))}${li('Cartão corporativo',fmt(r.cartaoCorporativo))}${li('Comprovantes anexados',an.length)}</div>
<h2>Despesas / Expenses</h2><table><tr><th>#</th><th>Data</th><th>Despesa</th><th>Valor</th><th>Dist.</th><th>Origem</th><th>Destino</th><th>Obs.</th><th>OS/SR</th><th>Anex.</th></tr>${r.despesas.map((d,i)=>`<tr><td>${i+1}</td><td>${fd(d.data)}</td><td>${d.tipoNome}</td><td>${fmt(d.valor)}</td><td>${d.distancia||''}</td><td>${esc(d.origem)}</td><td>${esc(d.destino)}</td><td>${esc(d.observacao)}</td><td>${esc(d.osSr)}</td><td>${d.anexos.length}</td></tr>`).join('')}</table>
<h2>Somatórios e Resumo Financeiro</h2><div class="g"><div><span>Total das despesas</span><b>${fmt(t.totalDespesas)}</b></div>${t.porCategoria.filter(c=>c.total>0).map(c=>`<div><span>${c.nome}</span><b>${fmt(c.total)}</b></div>`).join('')}<div><span>Adiantamento</span><b>${fmt(t.adiantamento)}</b></div><div><span>Cartão corporativo</span><b>${fmt(t.cartaoCorporativo)}</b></div><div><span>A devolver</span><b>${fmt(t.valorDevolucao)}</b></div><div><span>A reembolsar</span><b>${fmt(t.valorReembolso)}</b></div></div>
${r.comentarios?`<div class="cm"><b>Comentários:</b><br>${esc(r.comentarios)}</div>`:''}
<div class="sg"><div>VISTO VIAJANTE</div><div>GESTOR</div><div>ADM</div></div>
<div class="ft">versão RAVE Web · baseado na planilha RAVE 4.0 · ©2024 NCR ATLEOS, All rights reserved. NCR ATLEOS – Confidential (Restricted)</div>
${hr?(()=>{const im=hr.tipo==='application/pdf'?(hr.paginasImagem||[]):[hr.dataUrl],T='ANEXO — RESERVA DE HOSPEDAGEM';if(!im.length)return`<div class="pg"><p><b>${T}</b> — ${esc(hr.nome)}</p><p>Não foi possível renderizar as páginas deste arquivo.</p></div>`;return im.map((s,i)=>`<div class="pg"><p><b>${T}</b> — ${esc(hr.nome)}${im.length>1?` (pág. ${i+1}/${im.length})`:''}</p><img src="${s}"></div>`).join('')})():''}
${an.map(a=>{const im=a.tipo==='application/pdf'?(a.paginasImagem||[]):[a.dataUrl];return im.map((s,i)=>`<div class="pg"><p><b>Comprovante: ${esc(a.nome)}</b> — ${a.d.tipoNome} · ${fd(a.d.data)} · ${fmt(a.d.valor)}${im.length>1?` (pág. ${i+1}/${im.length})`:''}</p><img src="${s}"></div>`).join('')}).join('')}
</body></html>`}
function exportar(r){const w=window.open('','_blank');if(!w){alert('Habilite pop-ups para exportar o PDF.');return}
w.document.open();w.document.write(html(r));w.document.close();setTimeout(()=>{w.focus();w.print()},800)}

function nf(){M.innerHTML=`<div style="text-align:center;padding:4rem 1rem"><h1 style="font-size:4rem;margin:0">404</h1><p>Page Not Found</p><a class="btn" href="#/">Go Back Home</a></div>`}
function renderApp(){try{const p=(location.hash.slice(1)||'/').replace(/\/$/,'')||'/';let m;
$('#ft').innerHTML=p==='/'?'':'RAVE Web · ©2024 NCR ATLEOS · Baseado na planilha RAVE 4.0';
if(!perfilCompleto()&&p!=='/perfil')return perfilForm(true);
if(p==='/')home();else if(p==='/perfil')perfilForm(false);else if(p==='/relatorio/novo')relForm();
else if(m=p.match(/^\/relatorio\/([^/]+)\/editar$/))relForm(m[1]);
else if(m=p.match(/^\/relatorio\/([^/]+)\/despesa\/nova$/))despForm(m[1],null,false);
else if(m=p.match(/^\/relatorio\/([^/]+)\/despesa\/([^/]+)$/))despForm(m[1],m[2]);
else if(m=p.match(/^\/relatorio\/([^/]+)$/))detail(m[1]);else nf();scrollTo(0,0)}
catch(e){console.error(e);M.innerHTML=`<div class="card"><h3>${ic('alert')} Algo deu errado</h3><p class="mut">${esc(e.message)}</p><a class="btn" href="#/">Voltar ao início</a></div>`}}
function render(){
 $('#us').classList.toggle('hid',!USER||RECOVERY);
 if(!sb){$('#ft').innerHTML='';M.innerHTML='<div class="card"><div class="err">Não foi possível carregar o serviço de login. Verifique a conexão e recarregue a página.</div></div>';return}
 if(!BOOTED){M.innerHTML='<div class="card"><p class="mut">Carregando…</p></div>';return}
 if(!USER||RECOVERY)return telaLogin();
 renderApp()
}
addEventListener('hashchange',render);
addEventListener('online',()=>{if(USER)flush()});
document.addEventListener('visibilitychange',async()=>{
 if(document.visibilityState!=='visible'||!USER||RECOVERY||Object.keys(PEND).length)return;
 try{if(await carregarDados()&&(location.hash.slice(1)||'/')==='/')render()}catch(e){}
});
$('#out').onclick=sair;
render();
if(sb)sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>sessao(s,ev),0)});
</script></body></html>
